<body>

<div style="min-height: 900px; box-sizing: border-box; background: #f4f4f1; color: #222; font-family: system-ui, sans-serif; display: flex; flex-direction: column">

<a href="Estado.dc.html" style="min-height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border: 2px solid #bbbbbb; border-radius: 6px; color: #222; text-decoration: none; font-size: 15px">Estado de vacunación</a>
<a href="Vacuna.dc.html" style="min-height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border: 2px solid #bbbbbb; border-radius: 6px; color: #222; text-decoration: none; font-size: 15px">Información de vacunas</a>

<main style="flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; box-sizing: border-box; padding: 40px 32px; display: flex; flex-direction: column; gap: 32px">

<!-- Encabezado del paciente seleccionado -->
<section style="background: #ffffff; border: 2px solid #222; border-radius: 10px; padding: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px">
<div>
  <span style="background: #222; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: 700; text-transform: uppercase">Historial Clínico</span>
  <h1 id="nombre-paciente" style="margin: 8px 0 4px 0; font-size: 28px">Cargando paciente...</h1>
  <p id="info-paciente" style="margin: 0; color: #555; font-size: 15px">Obteniendo registros...</p>
</div>
<div>
  <a href="index.dc.html" style="padding: 10px 16px; background: #fff; border: 2px solid #222; border-radius: 6px; color: #222; font-weight: 600; text-decoration: none; font-size: 14px">Elegir otro paciente</a>
</div>
</section>

<!-- Contenido del historial -->
<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 22px">Registro de Aplicaciones</h2>

<div id="contenedor-historial" style="background: #ffffff; border: 2px solid #222; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
  <div style="color: #666; text-align: center;">Cargando historial de vacunas...</div>
</div>
</section>

</main>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
const SUPABASE_URL = 'https://blinniyzzhrrulsdqiif.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QEbeOMK2LCNmgLy6uCA4Hw_lC74mcc7';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

class Component extends DCLogic {
  async componentDidMount() {
    // 1. Capturar el ID de la URL (?id=...)
    const urlParams = new URLSearchParams(window.location.search);
    const pacienteId = urlParams.get('id');

    if (!pacienteId) {
      document.getElementById('nombre-paciente').textContent = "Ningún paciente seleccionado";
      document.getElementById('info-paciente').textContent = "Por favor regresa al inicio y selecciona un perfil.";
      document.getElementById('contenedor-historial').innerHTML = '<div style="color:#d32f2f;">No se especificó ningún ID de paciente en la URL.</div>';
      return;
    }

    // 2. Consultar los datos del paciente específico en Supabase usando su ID
    const respuestaPaciente = await supabase
      .from('pacientes')
      .select('*')
      .eq('id', pacienteId)
      .single();

    var paciente = respuestaPaciente.data;
    var errorPaciente = respuestaPaciente.error;

    if (errorPaciente || !paciente) {
      document.getElementById('nombre-paciente').textContent = "Paciente no encontrado";
      document.getElementById('info-paciente').textContent = "El ID proporcionado no existe en la base de datos.";
      return;
    }

    // Calcular edad actual
    var nacimiento = new Date(paciente.nacimiento);
    var hoy = new Date();
    var edad = hoy.getFullYear() - nacimiento.getFullYear();
    var m = hoy.getMonth() - nacimiento.getMonth();
    if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) {
      edad--;
    }

    // Mostrar la información real del paciente en el encabezado
    document.getElementById('nombre-paciente').textContent = paciente.nombre;
    document.getElementById('info-paciente').innerHTML = 'Relación: ' + paciente.relacion + ' | Fecha de nacimiento: ' + paciente.nacimiento + ' (' + edad + ' años)';

    // 3. Aquí puedes cargar el historial de vacunas filtrado por este paciente si tienes otra tabla (ej. 'historial')
    // Por ahora, mostramos una estructura dinámica basada en sus datos:
    var historialHtml = '<div style="padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between;">' +
      '<div><strong>Registro inicial de perfil creado</strong><br><span style="font-size: 13px; color: #666;">Fecha de registro en sistema</span></div>' +
      '<span style="color: #1f7a6d; font-weight: 600;">Completado</span>' +
    '</div>';

    document.getElementById('contenedor-historial').innerHTML = historialHtml;
  }

  renderVals() {
    return {};
  }
}
</script>
</body>

</body>
