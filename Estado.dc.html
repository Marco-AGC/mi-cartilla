<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
const SUPABASE_URL = 'https://blinniyzzhrrulsdqiif.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QEbeOMK2LCNmgLy6uCA4Hw_lC74mcc7';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

class Component extends DCLogic {
  async componentDidMount() {
    const urlParams = new URLSearchParams(window.location.search);
    const pacienteId = urlParams.get('id');

    if (!pacienteId) {
      document.getElementById('nombre-paciente').textContent = "Ningún paciente seleccionado";
      document.getElementById('info-cartilla').textContent = "Por favor regresa al inicio y selecciona o registra un paciente.";
      return;
    }

    const { data: paciente, error } = await supabase
      .from('pacientes')
      .select('*')
      .eq('id', pacienteId)
      .single();

    if (error || !paciente) {
      document.getElementById('nombre-paciente').textContent = "Paciente no encontrado";
      return;
    }

    const nacimiento = new Date(paciente.nacimiento);
    const hoy = new Date();
    let edad = hoy.getFullYear() - nacimiento.getFullYear();
    const m = hoy.getMonth() - nacimiento.getMonth();
    if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) {
      edad--;
    }

    let tipoCartilla = "Adultos (20 a 59 años)";
    if (edad >= 0 && edad <= 9) tipoCartilla = "Niñas y Niños (0 a 9 años)";
    else if (edad >= 10 && edad <= 19) tipoCartilla = "Adolescentes (10 a 19 años)";
    else if (edad >= 60) tipoCartilla = "Adultos Mayores (60 años o más)";

    document.getElementById('nombre-paciente').textContent = paciente.nombre;
    document.getElementById('info-cartilla').innerHTML = `Edad: ${edad} años | Cartilla Asignada: <strong>${tipoCartilla}</strong>`;
  }

  renderVals() {
    return {};
  }
}
</script>
